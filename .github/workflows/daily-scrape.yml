name: Daily Rising Stocks Scrape

on:
  schedule:
    # 한국시간(KST) 기준 실행 시각 = UTC + 9시간
    # 매 정시(0분)는 GitHub 전체에서 몰려 지연되기 쉬워 3분 오프셋을 줌
    # 09:03 ~ 15:53 KST (00:03 ~ 06:53 UTC) 사이 10분 간격, 평일만 실행
    - cron: "3,13,23,33,43,53 0-6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape_rising.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --quiet --cached || git commit -m "chore: update rising stocks $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
